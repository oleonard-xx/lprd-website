<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{=title}}</title>
  <meta name="description" content="{{=description}}">
  <meta name="theme-color" content="{{=themeColor}}">
  {{{robots}}}
  <link rel="canonical" href="{{=canonical}}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{=title}}">
  <meta property="og:description" content="{{=description}}">
  <meta property="og:locale" content="ro_RO">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/base.css">
  <script src="/js/boot.js"></script>
  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/fx.js"></script>
  <script type="application/ld+json">{{{jsonLd}}}</script>
</head>
<body class="page-{{=page}}">
  <a class="skip-link" href="#main">Sari la conținutul principal</a>
  {{{cookieBanner}}}
  {{{header}}}
  <main id="main" tabindex="-1">
{{{content}}}
  </main>
  {{{footer}}}
  <button type="button" class="scroll-orb" data-scroll-orb aria-label="Înapoi la începutul paginii" hidden>
    <canvas class="scroll-orb-canvas" aria-hidden="true"></canvas>
    <svg class="scroll-orb-ring" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
      <circle class="scroll-orb-track" cx="32" cy="32" r="30"/>
      <circle class="scroll-orb-progress" cx="32" cy="32" r="30" pathLength="100"/>
    </svg>
  </button>
  <div class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
